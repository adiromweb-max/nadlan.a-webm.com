name: nadlan-scout weekly bonanza
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bonanza:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Install chromium for card render
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Generate and send bonanza
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_TO: ${{ secrets.GREENAPI_TO }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          GREENAPI_MEDIA_URL: ${{ secrets.GREENAPI_MEDIA_URL }}
        run: python -m scout.bonanza
      - name: Commit outputs
        run: |
          git config user.name "nadlan-scout-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f out/bonanza data/nadlan.db || true
          git commit -m "weekly bonanza [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
