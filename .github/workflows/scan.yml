name: nadlan-scout daily scan
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nadlan-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python -m scout.main --dry-run
      - name: Publish dashboard
        run: |
          mkdir -p docs
          cp out/app.html docs/index.html
      - name: Commit results
        run: |
          git config user.name "nadlan-scout-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/nadlan.db docs/index.html out/latest.json || true
          git commit -m "daily scan [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
