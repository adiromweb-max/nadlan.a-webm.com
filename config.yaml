# nadlan-scout — קובץ הגדרות לדוגמה. העתק ל-config.yaml וערוך.
# (הסיסמאות לא כאן — הן ב-secrets.env)

# ---- ערים ----
# ערוך כאן בחופשיות: הוסף/הסר קבוצה שלמה או עיר בודדת.
# הקבוצות מתמזגות לרשימה אחת (‎cities‎) לפי הסדר, בלי כפילויות.
# כדי לכבות קבוצה שלמה — הוסף לה ‎#‎ בכל שורה, או פשוט מחק אותה.
# שמות היישובים חייבים להתאים לאינדקס הלמ"ס של נדל"ן ממשלתי (ראה הלוג:
# "לא נמצא קוד יישוב עבור X" = השם לא זוהה).
city_groups:
  south:                        # הדרום — הליבה ההיסטורית של המערכת
    - באר שבע
    - אשקלון
    - אשדוד
    - קרית גת
    - קרית מלאכי
    - שדרות
    - נתיבות
    - אופקים
    - רהט
    - דימונה
    - ירוחם
    - מצפה רמון
    - ערד
    - אילת
    - עומר
    - מיתר
    - להבים
  shfela:                       # השפלה
    - רחובות
    - נס ציונה
    - יבנה
    - גדרה
    - גן יבנה
    - רמלה
    - לוד
    - בית שמש
    - קרית עקרון
  center:                       # המרכז
    - ראשון לציון
    - מודיעין-מכבים-רעות     # השם המדויק בלמ"ס (בלי המקפים אין התאמה)
    - יהוד-מונוסון           # ‏"‏יהוד‏"‏ לבדו מתאים גם לאבן יהודה/טירת יהודה
    - אור יהודה
    - ראש העין
    - פתח תקווה

# ערים בודדות מחוץ לקבוצות (נוספות לרשימה כמו שהן)
cities: []

# ---- מסלול ארצי: מחיר למשתכן ----
# שני מסלולים, בכוונה. הערים למעלה הן האזורים שאני מכיר ושופט בעצמי.
# הערים כאן נבחרות **מהנתון**, לא מהיכרות: ערים שבהן המגבלה על פרויקטי
# מחיר למשתכן כבר פגה, מדורגות לפי כמות היח"ד המשוחררות, ומסוננות לפי
# אומדן המחיר הנוכחי (מחיר מסובסד × 90 מ"ר × 1.6, שהיא העלייה החציונית
# שנמדדה בפועל) כדי לא לשרוף קרדיטים בערים שבהן אין דירה בטווח — ירושלים,
# הרצליה, רמת גן וכדומה סוננו כך החוצה.
# 20 ערים × 30 קרדיטים = 600, מתוך תקציב של 3000 לריצה.
# לייצור מחדש של הרשימה: דירוג לפי data/mlm_projects.geojson.
mlm_cities:
  # ── ערים שכבר נסרקות: ההוספה כאן נותנת להן את הטווח הרחב ועולה
  #    אפס קרדיטים נוספים — זו אותה בקשה, עם טווח מחיר אחר בלבד.
  - באר שבע         # 4,536 יח"ד משוחררות; התקרה חתכה את הגל כולו
  - אשקלון          # 6,221
  - שדרות           # 1,890
  - דימונה          # 1,705
  - נתיבות          # 1,591
  - קרית גת         # 1,482
  - אופקים          # 840
  # ── ערים חדשות למסלול הארצי ──
  - טירת כרמל       # 3,995 יח"ד משוחררות — הבריכה הגדולה ביותר
  - חריש            # 3,272
  - קרית מוצקין     # 2,458
  - קרית ים         # 2,318
  - עכו             # 2,207
  - קרית ביאליק     # 1,507
  - כרמיאל          # 1,071
  - עפולה           # 994
  - אור עקיבא       # 875
  - מגדל העמק       # 828
  - נהריה           # 718
  - עתלית           # 562
  - באר יעקב        # 477
  - נצרת            # 472
  - אריאל           # 444
  - קרית שמונה      # 423
  - פרדס חנה-כרכור  # 395
  - נצרת עלית       # 376
  - מעלות-תרשיחא    # 362
  - יקנעם עלית      # 352

# פילטרים
price_min: 300000
price_max: 1500000

# טווח רחב יותר לערי המסלול הארצי. הסיבה נמדדה: בבאר שבע המחיר הגבוה
# ביותר שנסרק היה 1,499,000 ₪ — בדיוק על התקרה — ו-16 מודעות ישבו 200 מ'
# ממתחם מחיר למשתכן בלי שאף אחת נכנסה אליו. גל של 4,536 יח"ד משוחררות
# נחתך לפני שהגיע ל-DB. ההסבר ב-‎yad2.price_band()‎.
mlm_price_min: 300000
mlm_price_max: 2000000

property_type: apartment      # דירות בלבד

# סף התראה (ציון אטרקטיביות 0..100).
# נשמר לתאימות ולשער הסינון המקדים; ההתראה עצמה נקבעת לפי tiers שלמטה.
alert_threshold: 70

# ---- דירוג (מחליף את סף ההתראה הבודד) ----
# רק "לבדוק דחוף" מופיע בכותרת המייל.
# "לבדוק דחוף" דורש גם פער אמיתי (8–30%) וגם אות תומך — ראה supporting_signal.
tiers:
  check_urgent: 78
  worth_checking: 66
  watch: 55

# משקלי הניקוד (סכום מקסימלי = 100)
# ‎peer_gap‎ נכנס עם 14 נקודות, וכל שאר המשקלים קוצצו ב-14% **באופן
# פרופורציונלי** (30→25.8, 15→12.9, 14→12 וכן הלאה). זה לא קוסמטי:
# הקיצוץ הראשון שנוסה היה לא-אחיד (price_gap ספג 60% מהקיצוץ בעוד
# שמשקלו הוא 39%), והתוצאה נמדדה — מודעות שהניקוד שלהן נשען על הפער
# מול העסקאות ספגו ~8% ומספר המודעות שעברו את הסינון צנח מ-40 ל-17.
# בקיצוץ פרופורציונלי, מודעה **בלי** קבוצת תאומות מקבלת בדיוק את הציון
# הישן שלה: כל רכיב שווה 0.86 מהקודם, וההכפלה בסולם (100/86) מחזירה אותו
# למקומו. מי שיש לו תאומות מתחרה על 100 הנקודות המלאות.
weights:
  price_gap: 25.8         # פער מול עסקאות אמיתיות באזור
  peer_gap: 14            # פער מול דירות זהות באותו רחוב, עכשיו
  price_drop: 12.9        # ירידת מחיר במודעה
  days_on_market: 12      # כמה זמן המודעה יושבת בשוק (ותק אמיתי מיד2)
  mlm_leverage: 10.3      # מחיר למשתכן משוחרר — כרית המוכר ולחץ ההיצע
  opportunity_keywords: 2.6
  area_liquidity: 2.6     # פרוקסי חלש (אוכלוסייה), ולכן משקל נמוך
  rental_yield: 12.9      # תשואת שכירות ברוטו (מוערכת)
  area_appreciation: 6.9  # עליית ערך רב-שנתית באזור (CAGR)

# פרמטרים לחישוב
price_gap_full_at_pct: 25    # ירידה של 25% מהחציון = ניקוד מלא בפער
comps_months: 12             # חלון עסקאות רשות המיסים אחורה

# ---- ותק בשוק ----
# הוותק נמדד מתאריך הפרסום האמיתי ביד2 (מוערך מתאריכי התמונות), לא מהרגע
# שהמנוע ראה את המודעה. הסקאלה נמתחה ל-270 יום כי הוותק החציוני בפועל
# הוא 74 יום: עם סף 90 כמעט 40% מהמודעות היו מקבלות ניקוד מלא, והאות
# שאמור להבדיל ביניהן היה נמחק. עכשיו 9 חודשים = ניקוד מלא, ומודעה
# שיושבת מעל שנה (65 מודעות בפועל) בולטת כמו שהיא צריכה.
days_on_market_full_at: 270
max_plausible_days_on_market: 1825   # מעל 5 שנים = תאריך תמונה שגוי

# ---- מחיר למשתכן ----
# הזיהוי מרחבי: נקודת המודעה מול שכבת הפוליגונים הרשמית ב-
# ‎data/mlm_projects.geojson‎. לא לפי שמות שכונות — הם שתי מערכות שונות
# (ביד2 "אירוס", אצל משרד השיכון "צפונית"; בבאר שבע "שכונה א'" מול
# "שכונת הפארק"). ההסבר המלא בראש ‎scout/mlm.py‎.
#
# כרית = המחיר המבוקש פחות מה שהמוכר שילם בהגרלה. היא מודדת כמה הוא
# **יכול** לרדת, לא כמה הדירה זולה — שני דברים שונים.
mlm_cushion_full_at_pct: 40    # כרית של 40% מהמחיר = ניקוד מלא ברכיב
mlm_supply_full_at_pct: 3.0    # 3% מדירות המתחם מוצעות יחד = לחץ מלא
signal_min_cushion_pct: 20     # מתחת לזה הכרית אינה אות תומך בפני עצמה

# ---- השוואת תאומות (scout/peers.py) ----
# "מבין הדירות הזהות שמוצעות עכשיו באותו רחוב — איזו הזולה, ובכמה."
# זו שאלה אחרת מזו של comps: שם משווים מול עסקאות שנסגרו באזור, כאן מול
# המתחרות שעומדות מול אותו קונה ברגע זה. שני המספרים חיים זה לצד זה.
#
# סינון הגודל הוא העיקר: 3 חדרים ב-62 מ"ר ו-3 חדרים ב-95 מ"ר אינן אותה
# דירה, וחציון משותף שלהן אינו בסיס. הקבוצה נחתכת ל-±15% סביב הגודל
# החציוני שלה, וקבוצה שנשארת קטנה מדי אחרי החיתוך לא מייצרת אות בכלל.
peer_min_street: 3            # מתחת לזה אין קבוצת רחוב
peer_min_hood: 4              # שכונה דורשת יותר — היא מערבבת בניינים
peer_size_tolerance_pct: 15   # חיתוך הגודל סביב החציון של הקבוצה
# הסקאלה הדוקה מזו של price_gap (20 מול 25) בכוונה: 20% מתחת לדירות
# **זהות באותו רחוב** הוא פער קיצוני, בעוד אותו פער מול חציון עירוני
# רב-גודל הוא שגרתי.
peer_gap_full_at_pct: 20
peer_gap_min_pct: 8           # פער קטן מזה אינו אות תומך
# בין תאומות אמיתיות הפרש של 35%+ כמעט תמיד אומר שמשהו בדירה שונה
# (קומה, מצב, חזית מול עורף) ולא שהמוכר טועה במחיר. לכן ניקוד מקוצץ.
peer_gap_suspect_pct: 35
peer_supply_window_days: 60   # חלון מדידת ההיצע שנוסף לקבוצה
# האות "ההיצע בקבוצה גדל" נדרש לשני תנאים נוספים מעבר למספר החדשות:
# (1) שלפחות חבר אחד בקבוצה כבר היה שם לפני החלון — אחרת אין בסיס להשוות
#     אליו, וזה קורה הרבה כי היסטוריית ה-DB קצרה מהשוק;
# (2) קבוצה גדולה דיה. נמדד: בסף 4 מודעות ו-2 חדשות האות נדלק על 17%
#     מכל המודעות — יותר מדי בשביל "ראיה". בסף 5 ו-3 הוא נדלק על 9%,
#     בסדר גודל של שאר האותות התומכים.
peer_min_new_for_signal: 3    # כמה מודעות חדשות בקבוצה הופכות לאות
peer_min_group_for_signal: 5  # וכמה חברים צריכים להיות בקבוצה בכלל
peer_drop_window_days: 60     # ירידה בתוך החלון נחשבת "לאחרונה"

# ---- מצב מעקב (scout/track.py) ----
# שתי ריצות נפרדות במקום אחת: **גיוס** שבועי שסורק ערים ומביא מלאי חדש,
# ו**מעקב** יומי שבודק רק את המודעות שמעניינות — כל אחת דרך דף המודעה
# שלה, בקרדיט אחד.
#
# למה: סריקת הערים עולה ~1,560 קרדיטים, וברוב הימים היא רק מגלה שהדירות
# שמעניינות אותנו לא זזו. בנוסף היא לא יכולה לענות על השאלה "האם המודעה
# הזאת עוד קיימת" — בסריקת חיפוש, מודעה שנמחקה ומודעה שלא הגיעה לעמוד
# הראשון נראות זהות. דף מודעה בודד מחזיר 404, וזו תשובה חד-משמעית.
# חשבון: 30 × 150 (מעקב) + 4 × 1,560 (גיוס) ≈ 9,200 לחודש, מול 46,800.
track_max_listings: 150         # תקרת קבוצת המעקב (המאושרות ידנית לא נחתכות)
track_max_credits: 300          # חסם בטיחות לריצת מעקב
track_include_high_conf: true   # מחיר למשתכן משוחרר בוודאות גבוהה
track_include_peer_leaders: true  # זולות מהתאומות / נשברו ראשונות
track_include_crowned: true     # מה שהמערכת הכתירה
track_peer_gap_min_pct: 8       # מאיזה פער מול התאומות נכנסים למעקב
# כמה 404 רצופים נדרשים כדי להכריז שמודעה נמחקה. למה לא אחד: סימון שגוי
# מוציא דירה **חיה** מהרשימה, וזו השגיאה היקרה יותר — קישור מת מבזבז
# דקה, דירה שנעלמה מבזבזת הזדמנות. במעקב יומי, 2 פירושו שקישור מת נעלם
# בתוך יומיים במקום שבועיים (inactive_after_days).
track_dead_confirmations: 2

# ---- השוואה like-for-like מול עסקאות שנסגרו ----
# חשוב: נדל"ן ממשלתי אינו חושף עסקה בודדת (403), אלא מחיר ממוצע רבעוני לפי
# קטגוריית חדרים. לכן comps_min_count סופר **תצפיות רבעון**, לא עסקאות.
# ההסבר המלא והמגבלות — בראש scout/comps.py.
comps_window_months: 18       # חלון ההשוואה (12–18 חודשים = 4–6 רבעונים)
comps_min_count: 5            # פחות מזה → "אין מספיק עסקאות", ניקוד בלי פער
comps_rooms_tolerance: 0.5    # חדרים ±0.5 (3.5 חדרים מושווה ל-3 וגם ל-4)
comps_size_tolerance_pct: 20  # חריגה מהגודל הטיפוסי → לא like-for-like
comps_gap_suspect_pct: 30     # פער גדול מזה = חשוד, לעולם לא בכותרת
comps_gap_min_pct: 8          # פער קטן מזה אינו "הזדמנות"
suspect_gap_score_factor: 0.5 # קיצוץ ניקוד לפער חשוד

# ---- אותות תומכים (נדרש לפחות אחד כדי להכתיר מודעה) ----
signal_min_drop_pct: 3        # ירידת מחיר משמעותית
signal_min_days_on_market: 60 # ותק ארוך = המוכר מתקשה למכור
signal_liquidity_frac: 0.7    # ניקוד נזילות מעל 70% מהמשקל

# ---- תשואת שכירות (הערכה, לא התחייבות) ----
# ההנחה: שכר הדירה הוא **הממוצע הרשמי המדווח** לקטגוריית החדרים באזור
# (data.nadlan.gov.il/api/pages/.../rent), לא שכר דירה בפועל של הנכס.
# זו תשואה **ברוטו**: בלי ניכוי ועד בית, ארנונה, תיווך, תחזוקה ותקופות ריקות.
# הנטו בפועל נמוך בדרך כלל ב-20%–30%.
rent_months_per_year: 12
yield_floor_pct: 2.0          # מתחת לזה — 0 נקודות
yield_full_at_pct: 5.0        # מכאן ומעלה — ניקוד מלא
yield_good_pct: 3.5           # מכאן נחשב "הזדמנות תשואה"

# ---- עליית ערך אזורית ----
appreciation_years: 5             # חלון ה-CAGR (יש ~5.5 שנות נתונים)
appreciation_min_quarters_per_year: 3  # שנה עם פחות מזה לא תשמש קצה לחישוב
cagr_full_at_pct: 6.0         # CAGR מכאן ומעלה — ניקוד מלא
cagr_good_pct: 3.0            # מכאן נחשב "הזדמנות עליית ערך"

# ---- שגיאות נתונים ----
# |ירידה| מעל זה אינה ירידת מחיר אלא שגיאה (ספרה שנפלה, מחיר שכירות בשדה
# מכירה). מסומן "בדיקה ידנית", לא מנוקד ולא נשלח בהתראה.
max_plausible_drop_pct: 60

# ---- דדופ התראות ----
# מודעה נשלחת רק בפעם הראשונה שחצתה את הסף, או אם מאז הציון עלה
# ב-alert_score_rise נקודות ומעלה, או שהמחיר ירד. השאר נספרות כ"דווחו כבר".
alert_score_rise: 10

# גודל דירה טיפוסי (מ"ר) לפי מספר חדרים.
# משמש להמרת מחיר העסקה הרשמי (₪ לעסקה, לפי מספר חדרים) ל-₪ למ"ר.
# אם יש מודעות אמיתיות באותה עיר+חדרים — הגודל החציוני שלהן עדיף על הטבלה הזו.
# ערוך אם אתה מכיר את השוק המקומי טוב יותר.
typical_size_sqm:
  2: 55
  3: 72
  4: 95
  5: 118
  6: 140

# ---- סריקת יד2 (דרך ScraperAPI) ----
# כל בקשה מוצלחת = קרדיט אחד. חשבון של 5,000 קרדיטים לחודש ≈ 165 ליום.
# עלות ריצה ≈ (ערים × yad2_max_pages_per_city) + max_final_checks_per_run.
yad2_max_pages_per_city: 1        # מסלול Hobby: ultra_premium=30 ק׳/בקשה. עמוד לעיר
                                  # (~36 מודעות) = ~2,200 ק׳ לריצה יומית ל-32 ערים ≈ 65k/חודש
yad2_concurrency: 3               # ScraperAPI מתיר 5 בו-זמנית
scraperapi_country: il            # רלוונטי רק אם ultra_premium=false (geotargeting)
# ---- פילטר מניפולציות מפרסם ----
# מחיר שהוא פער עצום מהשוק = כמעט תמיד מחיר-פיתיון או "זכויות/על הנייר",
# לא דירה אמיתית. מסומן disqualified ומוסר מההזדמנויות ומהפיד.
manipulation_gap_pct: 58          # פער מעל זה = מחיר חשוד → נפסל (מניפולציה כמעט ודאית).
                                  # פער 45–58% מסומן "לאימות" אך עדיין מוצג.
disqualify_keywords:              # מילים בעלות דיוק גבוה — לא דירת יד-שנייה
  - "זכויות רכישה"
  - "קבוצת רכישה"
  - "על הנייר"
  - "פינוי בינוי"
  - "פינוי-בינוי"
  - "קומבינציה"
  - "ללא טאבו"
  - "טאבו משותף"
  - "לא רשום בטאבו"
  - "מושע"
  - "בשלבי בנייה"
  - "מגרש"
  - "נחלה"

# ---- עלויות רכישה (לחישוב הפער נטו) ----
# ההכתרה נגזרת מ-comps_net_gap_min_pct — הפער **אחרי** עלויות העסקה, ולא
# מהפער המוצג. העלויות תלויות במסלול:
#   דירה ראשונה בדרום  → מס רכישה 0, ולכן ~0.6% פרטי / ~2.9% בתיווך
#   דירה שנייה ומעלה   → מס רכישה 8%, ולכן ~8.6% פרטי / ~11% בתיווך
# רק במסלול השני פער גולמי של 8% הוא הפסד ודאי.
# מסלול הקונה. ברירת המחדל היא **דירה ראשונה** — בטווח המחירים שהמנוע
# סורק בדרום (480 אלף עד 1.3 מיליון ₪) מס הרכישה שם הוא אפס, ולכן הנחה
# שכולם קונים דירה שנייה מעוותת את הפער נטו בשמונה נקודות אחוז.
# ‎second_home‎ הוא פיצ'ר תצוגה לצד הלקוח, לא ברירת המחדל של המנוע.
buyer_track: first_home           # first_home | second_home
purchase_tax_brackets:            # [תקרת מדרגה, שיעור באחוזים]; null = ללא תקרה
  first_home:
    - [1978745, 0]
    - [2347040, 3.5]
    - [6055070, 5]
    - [20183565, 8]
    - [null, 10]
  second_home:
    - [6055070, 8]
    - [null, 10]
legal_pct: 0.5                    # עו"ד (לפני מע"מ)
brokerage_pct: 2.0                # תיווך (לפני מע"מ) — נספר רק במודעת תיווך
vat_pct: 18.0
comps_net_gap_min_pct: 5          # הפער הנטו המינימלי להכתרה

# ---- אימות ברמת רחוב ----
# רץ רק על מודעות שעברו את השער, ולכן מותר לו להיות יקר. הבסיס הוא מחירי
# המבוקש של מודעות יד2 באותו רחוב — חלש מעסקאות סגורות, אבל זה הנתון
# היחיד שזמין ברמת רחוב בלי לעקוף שום הגנה. תפקידו וטו ואישור, לא חישוב
# הפער: אם מול הרחוב הפער מתאדה, ה"הנחה" היא מיקום ולא מחיר.
street_min_peers: 3               # מתחת לזה — "אין אימות רחוב", לא ניחוש
street_keep_gap_pct: 8.0          # פער מול הרחוב שמתחתיו מופעל וטו

# ---- איכות ההשוואה ----
# חציון ברמת יישוב ביישוב גדול מערבב שכונות שאין ביניהן קשר, ולכן אינו
# ראיה שדירה ספציפית מתחת לשוק. מעל הרף הזה — רק נתון שכונה מכתיר.
city_heterogeneous_population: 100000

# ---- מודעה שעומדת זמן רב והמחיר לא זז ----
# זה **לא** קנס יותר. הכיוון התהפך: קונה שמגיש הצעה נמוכה מחפש בדיוק את
# המוכר שפרסם לפני שנה ולא מכר — הוא לא חייב להוריד את המחיר בפרסום כדי
# להסכים להוריד אותו במשא ומתן. הסף שלמטה רק מפעיל כיתוב בכרטיס.
# ‎stale_no_drop_factor‎ בוטל (היה 0.25) — הוא חנק את האות הזה.
stale_suspect_days: 180

# ---- אנומליית גודל/חדרים ----
# 144 מ"ר עם 3 חדרים אינה טעות נתונים — זו חתימה של תוספת בנייה או פיצול,
# ולכן ה-₪/מ"ר הנמוך שם אינו הנחה. הדגל הזה היה עד היום כיתוב בדשבורד
# בלבד; כעת הוא חוסם הכתרה.
sqm_per_room_max: 45
sqm_per_room_min: 13

nadlan_via_scraperapi: true       # נתב בקשות nadlan דרך ScraperAPI (~1 ק׳/בקשה).
                                  # חובה כשהרץ בענן (GitHub) ש-nadlan חוסם את ה-IP שלו.
scraperapi_ultra_premium: true    # חובה ליד2 במסלול Hobby — geotargeting חוזר 403,
                                  # ורק ultra_premium עוקף את Radware. עולה 30 קרדיטים לבקשה.
scraperapi_credit_cost: 30        # עלות בקשת ultra_premium בקרדיטים (למעקב תקציב)
scraperapi_retries: 3             # בקשה שנכשלה אינה מחויבת, לכן retry זול

# ---- ניסיון חוזר ברמת העיר ----
# ‎scraperapi_retries‎ למעלה מטפל בבקשה שנכשלה טכנית. זה משהו אחר: יד2
# מחזיר דף **חסימה** במצב 200 — ScraperAPI הצליח, יד2 סירב. נמדד בריצת
# פרודקשן: 55 מתוך 66 בקשות הצליחו טכנית, ובכל זאת 37 מתוך 50 ערים
# חזרו ריקות. זו התנהגות הסתברותית: אותו URL מצליח בניסיון אחד ונכשל בבא.
#
# הגרסה הקודמת ויתרה על עיר שנכשלה עד הריצה הבאה. התקציב מאפשר לנסות
# שוב בנוחות — ריצה מלאה צרכה 1,650 קרדיטים מתוך 3,000.
yad2_city_retries: 1              # ניסיון חוזר מיידי נבדק והזיק: הוא הגדיל את מספר
                                  # הבקשות ויד2 חסם יותר. הפתרון הוא פיצול בזמן.

# ---- פיצול למשמרות ----
# יד2 חוסם לפי נפח, לא באקראי. נמדד בשתי ריצות רצופות על אותה רשימה:
# 55 בקשות → 8 ערים נכנסו; 96 בקשות → רק 6, ו-39 נכשלו.
# לכן מפצלים: שליש מהערים בכל ריצה, שלוש ריצות ביום בשעות שונות.
# אותו תקציב קרדיטים, שליש מהעומס הרגעי. הרשימה מסתובבת לפי היום כדי
# שעיר לא תיתקע תמיד באותה משמרת. המשמרת נבחרת בדגל ‎--shard‎.
yad2_shards: 3
yad2_retry_delay_sec: 4           # השהיה בין ניסיונות (גדלה בכל סבב)
scraperapi_timeout_seconds: 90
scraperapi_max_credits_per_run: 3300  # רשת ביטחון: מכסה 52 ערים × 2 ניסיונות

# ---- שלב הבדיקה לעומק (מול עסקאות אמיתיות) ----
# מודעה נבדקת מול נדל"ן ממשלתי רק אם עברה את השער: alert_threshold - prescreen_margin.
# המרווח קיים כי הסינון המקדים מודד מול מחירי מבוקש, והבדיקה הסופית מול
# עסקאות שנסגרו — ציון יכול לעלות משמעותית בין השניים.
prescreen_margin: 15
max_final_checks_per_run: 40      # תקרת מודעות לבדיקה לעומק בריצה
enrich_listings: true             # משיכת דף המודעה (תיאור מלא + מצב נכס)
finalize_concurrency: 3

# כמה ימים בלי שראינו מודעה עד שהיא מסומנת כלא-פעילה
# (הסריקה חלקית לפי עמודים, ולכן אי אפשר להסיק היעדרות מריצה בודדת)
inactive_after_days: 14

# סוגי נכס שנחשבים "דירה" (הבריף: דירות בלבד)
apartment_types:
  - דירה
  - דירת גן
  - דירת גג
  - פנטהאוז
  - מיני פנטהאוז
  - דופלקס
  - סטודיו
  - לופט

# מילות הזדמנות — נבדקות מול התגיות של יד2, מצב הנכס, והתיאור המלא
# (התיאור זמין רק למודעות שעברו לשלב הבדיקה לעומק).
# "בהזדמנות", "גמיש במחיר" ו"חבל לפספס" הן תגיות רשמיות של יד2.
# ---- מילות מוכר-לחוץ (אות הזדמנות אמיתי) ----
# מה שהוסר מכאן ולמה: "בהזדמנות", "הזדמנות", "חבל לפספס", "להשקעה" הן
# מילות שיווק של מפרסם — הן מתאמתות עם מודעות תיווך ועם מחיר מבוקש גבוה,
# ותגמול עליהן תגמל copywriting ולא עסקה. "ללא מעלית" הייתה כאן בטעות:
# היא מוריד ערך, לא סימן להזדמנות, ולכן עברה ל-risk_keywords.
# מה שנשאר ומה שנוסף: נסיבות שמצביעות על מוכר שצריך לסגור, לא על מודעה
# שמנוסחת היטב.
keywords:
  - דרוש שיפוץ
  - דורשת שיפוץ
  - לשיפוץ
  - גמיש
  - גמיש במחיר
  - למכירה דחופה
  - מוכר דחוף
  - דחוף למכירה
  - עסקת מזומן
  - מזומן
  - כניסה מיידית
  - פינוי מיידי
  - עקב עזיבת הארץ
  - עוזבים את הארץ
  - רילוקיישן
  - דירת ירושה
  - ירושה
  - יורשים
  - מוכר בחו"ל
  - ללא תיווך
  - מהבעלים

# ---- מילות סיכון בנכס עצמו ----
# אלה אינן פוסלות את המודעה מהפלט — הן חוסמות **הכתרה**. ההיגיון: כשיש
# דייר מוגן, חכירה לא מהוונת, חריגת בנייה או כינוס נכסים, המחיר הנמוך
# הוא המחיר הנכון ולא הנחה. משקיע שמרים טלפון על מודעה כזאת בלי לדעת
# מגלה את זה אחרי שבועיים, וזה בדיוק מה ששוחק את האמון במערכת.
risk_keywords:
  - דייר מוגן
  - דיירת מוגנת
  - דיירים מוגנים
  - שכירות מוגנת
  - כינוס נכסים
  - בכינוס
  - הוצאה לפועל
  - כונס נכסים
  - עיקול
  - חכירה
  - מהוונת
  - לא מהוונת
  - דמי היוון
  - דמי הסכמה
  - רשות מקרקעי ישראל
  - רמ"י
  - חברה משכנת
  - חריגות בנייה
  - חריגת בנייה
  - ללא היתר
  - לא מוסדר
  - בית משותף לא רשום
  - ללא מעלית
  - טרומי
  - אסבסט
  - צמוד לכביש
  - מעל חנות
  - לא ניתן למשכנתא
  - ללא אישור בנק
  - דירה מפוצלת
  - מפוצלת

# מייל
alert_to: adiromweb@gmail.com

# בקרת קצב (התנהגות עדינה מול האתרים)
request_delay_seconds: 3
request_timeout_seconds: 20
